{% extends "base.html" %}
{% block content %}
<div class="login-container">
    <h2>Авторизация в системе</h2>
    <form method="POST" action="{{ url_for('main.login') }}">
        <div class="form-group">
            <label for="login">Логин:</label>
            <input type="text" id="login" name="login" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Пароль:</label>
            <div class="password-wrapper">
                <input type="password" id="password" name="password" required autocomplete="current-password">
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Показать пароль">
                    <!-- Иконка открытого глаза (показывается, когда пароль ВИДЕН) -->
                    <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <!-- Иконка перечеркнутого глаза (показывается, когда пароль СКРЫТ) -->
                    <svg class="eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        toggleBtn.addEventListener('click', function() {
            // Проверяем текущий тип поля
            const isPassword = passwordInput.getAttribute('type') === 'password';

            // Переключаем тип поля
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

            // Переключаем класс для смены иконки
            this.classList.toggle('is-visible');

            // Обновляем атрибут для доступности (скринридеров)
            this.setAttribute('aria-label', isPassword ? 'Скрыть пароль' : 'Показать пароль');
        });
    });
</script>
{% endblock %}
